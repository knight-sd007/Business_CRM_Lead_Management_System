version: '3.8'

services:
  crm-api:
    build: .
    container_name: business_crm_lead_api
    ports:
      # Bind exclusively to loopback interface to prevent unauthorized external network exposure
      - "127.0.0.1:8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./crm_lead_management.db
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - crm_data:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  crm_data:
